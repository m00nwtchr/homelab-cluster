---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: &app ${APP}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: *app

  oidc:
    provider:
      issuer: "https://idm.${MAIN_DOMAIN}/oauth2/openid/${APP}"
    clientID: *app
    clientSecret:
      name: "kanidm-${APP}-oidc"
    redirectURL: "https://${SUBDOMAIN:=${APP}}.${DOMAIN:=${SECRET_DOMAIN}}/oauth2/callback"
    logoutPath: "/oauth2/logout"
    scopes:
      - openid
      - profile

    # Feed the authenticated ID token to Envoy's JWT filter.
    forwardIDToken:
      header: X-OIDC-ID-Token

  jwt:
    providers:
      - name: kanidm
        issuer: https://idm.${MAIN_DOMAIN}/oauth2/openid/${APP}
        audiences: [ *app ]
        remoteJWKS:
          uri: https://idm.${MAIN_DOMAIN}/oauth2/openid/${APP}/public_key.jwk
        extractFrom:
          headers:
            - name: X-OIDC-ID-Token
        claimToHeaders:
          - claim: preferred_username
            header: Remote-User
