---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: stunner
  labels:
    k8s-gateway.dns/ignore: "true"
  annotations:
    stunner.l7mp.io/enable-mixed-protocol-lb: "true"
    # stunner.l7mp.io/external-traffic-policy: local
    external-dns.alpha.kubernetes.io/hostname: "turn.${MAIN_DOMAIN}"
    external-dns.alpha.kubernetes.io/target: "external.${MAIN_DOMAIN}"
spec:
  addresses:
    - type: Hostname
      value: turn.${MAIN_DOMAIN}
  gatewayClassName: stunner
  listeners:
    - name: tls
      port: 5349
      protocol: TURN-TLS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ${APP}-tls
    - name: udp
      port: 3478
      protocol: TURN-UDP
      allowedRoutes:
        namespaces:
          from: All
