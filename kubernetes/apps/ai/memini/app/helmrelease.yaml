---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: memini
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v0.7.37
  url: oci://registry.erwanleboucher.dev/eleboucher/charts/memini
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app memini
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 30m
  values:
    fullnameOverride: *app
    controllers:
      main:
        type: deployment
        replicas: 1

        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault

        containers:
          main:
            env:
              MEMINI_HTTP_ADDR: ":8080"
              MEMINI_METRICS_ADDR: ":9090"
              MEMINI_UI_ADDR: ""
              MEMINI_LOG_LEVEL: info
              MEMINI_LOG_FORMAT: json

              MEMINI_BACKEND: postgres
              MEMINI_POSTGRES_DSN:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-postgres"
                    key: url

              MEMINI_REEMBED_ON_MODEL_CHANGE: "true"
              MEMINI_EMBED_BASE_URL: http://agentgateway-proxy.ai.svc.cluster.local./v1
              MEMINI_EMBED_MODEL: embeddinggemma-2
              MEMINI_EMBED_DIMS: "768"
              MEMINI_EMBED_MAX_CONCURRENCY: "1"
              MEMINI_EMBED_MAX_BATCH: "20"
              MEMINI_EMBED_QUERY_PREFIX: "task: search result | query: "

              # Embedding timeouts
              MEMINI_RECALL_EMBED_TIMEOUT: 15s
              MEMINI_WRITE_EMBED_TIMEOUT: 30s
              MEMINI_BACKGROUND_EMBED_TIMEOUT: 60s

              # LLM
              MEMINI_LLM_BASE_URL: http://agentgateway-proxy.ai.svc.cluster.local./anthropic
              MEMINI_LLM_API: anthropic
              MEMINI_LLM_API_KEY: dummy
              MEMINI_LLM_MODEL: MiniMax-M2.7
              # MEMINI_LLM_MAX_TOKENS: "24576"
              MEMINI_LLM_MAX_TOKEN: "16384"

              # Consolidation
              MEMINI_CONSOLIDATE_MODE: async
              MEMINI_DISTILL_ON_WRITE: "true"
              MEMINI_DISTILL_TIMEOUT: 600s

              # Memory
              MEMINI_DEFAULT_NAMESPACE: default
              MEMINI_WRITE_DEDUP_SCORE: "0.9"
              MEMINI_WRITE_DEDUP_ACTION: coalesce
              MEMINI_DEDUP_TIERS: episodic,semantic,procedural
              MEMINI_DEDUP_SIMILARITY: "0.85"
              MEMINI_SHORT_TERM_CAP: "300"

              # Importance assessment
              MEMINI_ASSESS_BATCH: "5"
              MEMINI_ASSESSED_SALIENCE_WEIGHT: "0.6"

              # Authentication
              MEMINI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: memini
                    key: MEMINI_API_KEY
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30

              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 15
                  timeoutSeconds: 3
                  failureThreshold: 3

              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]

            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi

    # PostgreSQL is external, no local database PVC.
    persistence:
      data:
        enabled: false

    service:
      main:
        ports:
          http:
            port: *port
            primary: true
          metrics:
            port: 9090

    route:
      main:
        enabled: true
        hostnames:
          - "{{ .Release.Name }}.${MAIN_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: network

    serviceMonitor:
      main:
        enabled: true

    grafanaDashboards:
      enabled: true
      folder: llm
