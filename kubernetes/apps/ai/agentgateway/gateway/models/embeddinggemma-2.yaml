---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: embeddinggemma-2
spec:
  source: pvc://llmkube-model-cache/2a53ea6e3829ef38/Embeddinggemma-2.gguf
  # source: https://huggingface.co/unsloth/embeddinggemma-2-GGUF/resolve/main/embeddinggemma-2-Q8_0.gguf
  format: gguf
  quantization: Q8_0
  hardware:
    accelerator: cpu
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: &model embeddinggemma-2
spec:
  modelRef: *model
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:c789283572ba78c2699b8945a96e654c850f938a717883f2e6187a14adac698f

  priority: normal
  contextSize: &ctx 8192
  batchSize: *ctx
  uBatchSize: *ctx
  parallelSlots: 1

  flashAttention: true
  cacheTypeK: q8_0
  cacheTypeV: q8_0

  extraArgs:
    - --alias
    - *model
    - --embeddings
    - --pooling
    - mean
    - --cont-batching
    - --threads
    - "6"
    - --threads-batch
    - "6"
    - --load-mode
    - mmap
    - --host
    - "::"

  replicas: 1
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400

  # modelCache:

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch

  securityContext:
    readOnlyRootFilesystem: true

  resources:
    cpu: 250m
    memory: 1Gi

  endpoint:
    port: 8080
    type: ClusterIP
---
