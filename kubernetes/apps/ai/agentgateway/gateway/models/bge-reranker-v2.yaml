---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/model_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: Model
metadata:
  name: bge-reranker-v2
spec:
  source: pvc://llmkube-model-cache/e0499e74b20c61c9/Bge-M3.gguf
  # source: https://huggingface.co/gpustack/bge-reranker-v2-m3-GGUF/resolve/main/bge-reranker-v2-m3-Q4_K_M.gguf
  format: gguf
  quantization: Q4_K_M
  hardware:
    accelerator: cpu
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/inference.llmkube.dev/inferenceservice_v1alpha1.json
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: &model bge-reranker-v2
spec:
  modelRef: *model
  image: ghcr.io/ggml-org/llama.cpp:server@sha256:d9e9e74ba3f7ef119b1939162b1631f99b75ec703c310d140cfa2fdac8907389

  priority: normal
  contextSize: 4096
  batchSize: 4096
  uBatchSize: 1024
  parallelSlots: 4

  flashAttention: true

  mode: rerank
  extraArgs:
    - --host
    - "::"
    - --alias
    - *model
    - --cont-batching
    - --kv-unified
    - --threads
    - "6"
    - --threads-batch
    - "12"
    - --load-mode
    - mmap

  replicas: 0
  rolloutPolicy:
    waitForIdle: true
    idleTimeoutSeconds: 86400

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile: { type: RuntimeDefault }
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch

  securityContext:
    readOnlyRootFilesystem: true

  resources:
    cpu: 250m
    memory: 1Gi

  endpoint:
    port: 8080
    type: ClusterIP
