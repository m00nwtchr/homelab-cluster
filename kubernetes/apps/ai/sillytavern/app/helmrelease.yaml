---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app sillytavern
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault

    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/sillytavern/sillytavern
              tag: 0.19.0@sha256:eef27ff0c7961f1a2f488400f581f48ff38f8b910c5d3b8d389138d71791bb14

            env:
              NODE_ENV: production
              FORCE_COLOR: "1"

              SILLYTAVERN_LISTEN: "true"
              SILLYTAVERN_PORT: "8000"
              SILLYTAVERN_HEARTBEATINTERVAL: "30"

              SILLYTAVERN_HOSTWHITELIST_ENABLED: "true"
              SILLYTAVERN_HOSTWHITELIST_HOSTS: '["{{ .Release.Name }}.${MAIN_DOMAIN}"]'

              # Envoy handles authentication.
              SILLYTAVERN_WHITELISTMODE: "false"
              SILLYTAVERN_BASICAUTHMODE: "false"

              # SillyTavern still needs local user accounts.
              SILLYTAVERN_ENABLEUSERACCOUNTS: "true"
              SILLYTAVERN_ENABLEDISCREETLOGIN: "true"

              SILLYTAVERN_PROTOCOL_IPV4: "true"
              SILLYTAVERN_PROTOCOL_IPV6: "true"

              # SSO via the Remote-User header.
              SILLYTAVERN_SSO_AUTHELIAAUTH: "true"
              SILLYTAVERN_SSO_AUTHENTIKAUTH: "false"
              SILLYTAVERN_SSO_TRUSTEDPROXIES: '["2001:cafe:42::/64","10.42.0.0/24"]'

              # Real client IP from Envoy.
              SILLYTAVERN_FORWARDEDHEADERS_XREALIP: "true"
              SILLYTAVERN_FORWARDEDHEADERS_XFORWARDEDFOR: "false"
              SILLYTAVERN_FORWARDEDHEADERS_CFCONNECTINGIP: "false"
              SILLYTAVERN_RATELIMITING_PREFERREALIPHEADER: "true"

            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: [ALL] }
              readOnlyRootFilesystem: false

            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi

            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - node
                      - src/healthcheck.js
                  periodSeconds: 5
                  timeoutSeconds: 10
                  failureThreshold: 24

              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - node
                      - src/healthcheck.js
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3

              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - node
                      - src/healthcheck.js
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 3

    service:
      app:
        ports:
          http:
            port: 80
            targetPort: 8000

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${MAIN_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: 80

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /home/node/app/config
            subPath: config
          - path: /home/node/app/data
            subPath: data
          - path: /home/node/app/plugins
            subPath: plugins
          - path: /home/node/app/public/scripts/extensions/third-party
            subPath: extensions
