---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-provider-keys
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: litellm-provider-keys
    template:
      engineVersion: v2
      data:
        MINIMAX_API_KEY: "{{ .MINIMAX_API_KEY }}"
        NEURALWATT_API_KEY: "{{ .NEURALWATT_API_KEY }}"
  dataFrom:
    - find:
        path: /minimax
    - find:
        path: /neuralwatt
