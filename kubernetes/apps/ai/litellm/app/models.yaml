---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: honcho-fast
spec:
  modelName: honcho-fast
  proxyRef: litellm
  params:
    model: minimax/MiniMax-M3.1-Flash
    apiKey: os.environ/MINIMAX_API_KEY
  info:
    mode: responses
    maxInputTokens: 1000000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsPromptCaching: true
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: honcho-quality
spec:
  modelName: honcho-quality
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6.1-sol
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsPromptCaching: true
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: honcho-embedding
spec:
  modelName: honcho-embedding
  proxyRef: litellm
  params:
    model: openai/qwen3-embedding-8b
    apiBase: https://api.neuralwatt.com/v1
    apiKey: os.environ/NEURALWATT_API_KEY
    additional:
      dimensions: 1024
  info:
    mode: embedding
    maxInputTokens: 32768
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: hermes
spec:
  modelName: hermes
  proxyRef: litellm
  params:
    model: minimax/MiniMax-M3
    apiKey: os.environ/MINIMAX_API_KEY
  info:
    mode: completion
    maxInputTokens: 1000000
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsPromptCaching: true
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: mealie
spec:
  modelName: mealie
  proxyRef: litellm
  params:
    model: openai/glm-5.3-flash
    apiBase: https://api.neuralwatt.com/v1
    apiKey: os.environ/NEURALWATT_API_KEY
  info:
    mode: completion
    supportsFunctionCalling: true
