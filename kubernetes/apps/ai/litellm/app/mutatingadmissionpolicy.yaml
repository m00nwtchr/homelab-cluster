---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/admissionregistration.k8s.io/mutatingadmissionpolicybinding_v1beta1.json
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: litellm-redis-tunnel
spec:
  policyName: litellm-redis-tunnel
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: ai
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/admissionregistration.k8s.io/mutatingadmissionpolicy_v1beta1.json
apiVersion: admissionregistration.k8s.io/v1beta1
kind: MutatingAdmissionPolicy
metadata:
  name: litellm-redis-tunnel
spec:
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: has-litellm-labels
      expression: >
        has(object.metadata.labels) &&
        object.metadata.labels["app.kubernetes.io/name"] == "litellm" &&
        object.metadata.labels["app.kubernetes.io/instance"] == "litellm" &&
        object.metadata.labels["app.kubernetes.io/managed-by"] == "litellm-operator"
    - name: has-litellm-container
      expression: >
        object.spec.containers.exists(c, c.name == "litellm")
    - name: missing-dragonfly-tunnel-container
      expression: >
        !has(object.spec.initContainers) ||
        !object.spec.initContainers.exists(c, c.name == "dragonfly-tunnel")
    - name: has-root-ca-volume
      expression: >
        has(object.spec.volumes) &&
        object.spec.volumes.exists(v, v.name == "root-ca")
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >
          [
            JSONPatch{
              op: "add",
              path: "/spec/volumes/-",
              value: Object.spec.volumes{
                name: "dragonfly-certs",
                csi: Object.spec.volumes.csi{
                  driver: "csi.cert-manager.io",
                  readOnly: true,
                  volumeAttributes: {
                    "csi.cert-manager.io/issuer-name": "dfguard-client-ca",
                    "csi.cert-manager.io/issuer-kind": "ClusterIssuer",
                    "csi.cert-manager.io/key-algorithm": "ECDSA",
                    "csi.cert-manager.io/key-size": "384",
                    "csi.cert-manager.io/key-encoding": "PKCS8",
                    "csi.cert-manager.io/key-usages": "client auth",
                    "csi.cert-manager.io/dns-names": "litellm"
                  }
                }
              }
            }
          ] +
          (
            !has(object.spec.initContainers)
            ? [
                JSONPatch{
                  op: "add",
                  path: "/spec/initContainers",
                  value: []
                }
              ]
            : []
          ) +
          [
            JSONPatch{
              op: "add",
              path: "/spec/initContainers/-",
              value: Object.spec.initContainers{
                name: "dragonfly-tunnel",
                image: "ghcr.io/m00nwtchr/dfguard:0.2.9@sha256:2a098b5d81e1dc56cabdd783f901660ffafdc4f4f6b6bc09271c4e926985b0a1",
                restartPolicy: "Always",
                args: ["tunnel"],
                env: [
                  Object.spec.initContainers.env{
                    name: "DFGUARD_TUNNEL_CERT",
                    value: "/var/run/secrets/dragonfly/tls.crt"
                  },
                  Object.spec.initContainers.env{
                    name: "DFGUARD_TUNNEL_KEY",
                    value: "/var/run/secrets/dragonfly/tls.key"
                  },
                  Object.spec.initContainers.env{
                    name: "DFGUARD_TUNNEL_CA",
                    value: "/var/run/secrets/root-ca/ca.crt"
                  },
                  Object.spec.initContainers.env{
                    name: "DFGUARD_TUNNEL_UPSTREAM",
                    value: "dfguard.database.svc.cluster.local.:6379"
                  },
                  Object.spec.initContainers.env{
                    name: "DFGUARD_TUNNEL_TCP_NODELAY",
                    value: "true"
                  }
                ],
                volumeMounts: [
                  Object.spec.initContainers.volumeMounts{
                    name: "dragonfly-certs",
                    mountPath: "/var/run/secrets/dragonfly",
                    readOnly: true
                  },
                  Object.spec.initContainers.volumeMounts{
                    name: "root-ca",
                    mountPath: "/var/run/secrets/root-ca",
                    readOnly: true
                  }
                ]
              }
            }
          ]
