---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: honcho
spec:
  proxyRef: litellm
  keyAlias: Honcho
  secretName: litellm-key-honcho
  secretKey: api-key
  models:
    - honcho-fast
    - honcho-quality
    - honcho-embedding
---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: hermes
spec:
  proxyRef: litellm
  keyAlias: Hermes
  secretName: litellm-key-hermes
  secretKey: api-key
  models:
    - hermes
  secretAnnotations:
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: hermes
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
