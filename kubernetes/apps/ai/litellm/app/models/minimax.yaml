---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: minimax-m3.1-flash
spec:
  modelName: MiniMax-M3.1-Flash
  proxyRef: litellm
  params:
    model: minimax/MiniMax-M3.1-Flash
    apiBase: https://api.minimax.io/anthropic/v1/messages
    apiKey: os.environ/MINIMAX_API_KEY
    additional:
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: messages
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    # https://platform.minimax.io/docs/pricing/overview — flat Flash pricing.
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6.0e-07
      cache_read_input_token_cost: 1.5e-08
      cache_creation_input_token_cost: 1.5e-07
      supports_adaptive_thinking: true
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: minimax-m3
spec:
  modelName: MiniMax-M3
  proxyRef: litellm
  params:
    model: minimax/MiniMax-M3
    apiBase: https://api.minimax.io/anthropic/v1/messages
    apiKey: os.environ/MINIMAX_API_KEY
    additional:
      additional_drop_params:
        - reasoning_effort
  info:
    mode: messages
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 3.0e-07
      cache_creation_input_token_cost: 3.0e-07
      cache_read_input_token_cost: 6.0e-08
      output_cost_per_token: 1.2e-06
      input_cost_per_token_above_512k_tokens: 6.0e-07
      output_cost_per_token_above_512k_tokens: 2.4e-06
      cache_read_input_token_cost_above_512k_tokens: 1.2e-07
