---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-chatgpt
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6.1-terra
    additional:
      additional_drop_params:
      - temperature
      order: 1
  info:
    mode: responses
    maxInputTokens: 922000
    maxOutputTokens: 128000
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.0e-06
      cache_creation_input_token_cost: 1.25e-06
      cache_read_input_token_cost: 5.0e-08
      output_cost_per_token: 5.0e-06
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-minimax-m3.1-flash
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: minimax/MiniMax-M3.1-Flash
    apiBase: https://api.minimax.io/v1
    apiKey: os.environ/MINIMAX_API_KEY
    additional:
      order: 2
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    # https://platform.minimax.io/docs/pricing/overview — flat Flash pricing.
    extra:
      input_cost_per_token: 1.5e-07
      output_cost_per_token: 6.0e-07
      cache_read_input_token_cost: 1.5e-08
      cache_creation_input_token_cost: 1.5e-07
      supports_adaptive_thinking: true
      supports_reasoning: true
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning-pool-glm-flash
spec:
  modelName: reasoning-pool
  proxyRef: litellm
  params:
    model: openai/glm-5.3-flash
    apiBase: https://api.neuralwatt.com/v1
    apiKey: os.environ/NEURALWATT_API_KEY
    additional:
      order: 4
      allowed_openai_params:
        - reasoning_effort
  info:
    mode: chat
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 1.5e-07
      cache_creation_input_token_cost: 1.5e-07
      cache_read_input_token_cost: 3.0e-08
      output_cost_per_token: 5.0e-07
