---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: auto
spec:
  modelName: auto
  proxyRef: litellm
  params:
    model: auto_router/complexity_router
    additional:
      complexity_router_default_model: MiniMax-M3.1-Flash
      complexity_router_config:
        tiers:
          # SIMPLE: qwen3.8-flash-next
          MEDIUM: MiniMax-M3.1-Flash
          COMPLEX: neuralwatt/glm-5.3-flash
          REASONING: chatgpt/gpt-6.1-sol
        classifier_type: llm
        classifier_llm_config:
          model: MiniMax-M3.1-Flash
          timeout_ms: 20000
        classifier_fallback: default_model
        session_affinity: true
        session_affinity_ttl_seconds: 3600
