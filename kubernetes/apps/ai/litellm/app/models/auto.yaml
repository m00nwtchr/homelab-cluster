---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: auto
spec:
  modelName: auto
  proxyRef: litellm
  params:
    model: auto_router/complexity_router
    additional:
      complexity_router_default_model: MiniMax-M3.1-Flash
      complexity_router_config:
        tiers:
          SIMPLE: deepseek-v4.1-flash
          MEDIUM: MiniMax-M3.1-Flash
          COMPLEX: reasoning-pool
          REASONING: reasoning-pool

      classifier_type: jev
      jev_classifier_config:
        model: jev-latest
        timeout_ms: 3000
        circuit_breaker_enabled: true

      classifier_fallback: default_model
      classifier_context_window_size: 3
      # classification_mode: user_turn

      session_affinity: true
      session_affinity_ttl_seconds: 3600
