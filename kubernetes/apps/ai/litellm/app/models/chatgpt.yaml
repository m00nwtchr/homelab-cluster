---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: gpt-6-astra
spec:
  modelName: chatgpt/gpt-6-astra
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-astra
    additional:
      additional_drop_params:
        - temperature
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.0e-05
      cache_creation_input_token_cost: 1.25e-05
      cache_read_input_token_cost: 1.0e-06
      output_cost_per_token: 5.0e-05
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: gpt-6-luna
spec:
  modelName: chatgpt/gpt-6-luna
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6-luna
    additional:
      additional_drop_params:
        - temperature
      extra_body:
        reasoning:
          effort: max
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 1.0e-07
      cache_creation_input_token_cost: 1.25e-07
      cache_read_input_token_cost: 1.0e-08
      output_cost_per_token: 5.0e-07
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: gpt-6.1-sol
spec:
  modelName: chatgpt/gpt-6.1-sol
  proxyRef: litellm
  params:
    model: chatgpt/gpt-6.1-sol
    additional:
      additional_drop_params:
        - temperature
  info:
    mode: responses
    maxInputTokens: 272000
    maxOutputTokens: 128000
    supportsVision: true
    supportsPromptCaching: true
    extra:
      input_cost_per_token: 2.0e-06
      cache_creation_input_token_cost: 2.5e-06
      cache_read_input_token_cost: 1.0e-07
      output_cost_per_token: 1.0e-05
