---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/database
    - ../../../../components/secret
    - ../../../../components/kopiur
  dependsOn:
    - name: litellm-operator
      namespace: litellm-system
    - name: kopiur
      namespace: kopiur-system
  healthChecks:
    - apiVersion: litellm.home-operations.com/v1alpha1
      kind: LiteLLMProxy
      name: litellm
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/litellm/app
  postBuild:
    substitute:
      APP: *app
      KOPIUR_ACCESSMODES: ReadWriteOnce
      KOPIUR_CAPACITY: 1Gi
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
