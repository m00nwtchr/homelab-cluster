---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: agones
spec:
  interval: 1h
  url: https://agones.dev/chart/stable
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app agones
spec:
  interval: 1h
  chart:
    spec:
      chart: *app
      version: 1.59.0
      sourceRef:
        kind: HelmRepository
        name: *app
  values:
    gameservers:
      namespaces: [games]
