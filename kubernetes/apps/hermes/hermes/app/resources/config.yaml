model:
  default: hermes
  provider: custom
  base_url: http://litellm.ai.svc.cluster.local/v1
  api_mode: chat_completions
  key_env: HERMES_LITELLM_API_KEY
toolsets:
  - hermes-cli
agent:
  max_turns: 150
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  verify_on_stop: false
  reasoning_effort: medium
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
web:
  backend: brave-free
  use_gateway: false
browser:
  cloud_provider: local
  use_gateway: false
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
display:
  tool_progress: all
dashboard:
  public_url: "https://${APP}.${MAIN_DOMAIN}"
  oauth:
    provider: self-hosted
    self_hosted:
      issuer: https://idm.${MAIN_DOMAIN}/oauth2/openid/${APP}
      client_id: hermes
privacy:
  redact_pii: true
memory:
  provider: honcho
  auto_migrate: true
security:
  redact_secrets: true
streaming:
  enabled: false
_config_version: 33
platform_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  matrix:
    - hermes-matrix
session_reset:
  mode: none
known_plugin_toolsets:
  cli:
    - spotify
