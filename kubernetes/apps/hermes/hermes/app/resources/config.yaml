---
# Managed infrastructure overlay; profile preferences remain on the PVC.
dashboard:
  oauth:
    provider: self-hosted
    self_hosted:
      client_id: hermes
      issuer: https://idm.${MAIN_DOMAIN}/oauth2/openid/${APP}
      scopes: openid profile email
  public_url: https://hermes-dash.${MAIN_DOMAIN}

gateway:
  multiplex_profiles: true

security:
  redact_secrets: true

terminal:
  backend: local
  cwd: /opt/data/workspace
  env_passthrough:
    - SEARXNG_URL

telemetry:
  shared_metrics:
    enabled: false
    send: false

webapp:
  enabled: true
  host: "::"
  port: 9120
  public_url: https://${APP}.${MAIN_DOMAIN}

model:
  default: auto
  provider: litellm

fallback_providers:
  - provider: litellm
    model: glm-5.3
  - provider: litellm
    model: deepseek-v4.1-flash

providers:
  litellm:
    api: http://litellm.ai/v1
    transport: chat_completions
    key_env: HERMES_LITELLM_API_KEY
    session_affinity_header: x-litellm-session-id
  litellm-anthropic:
    api: http://litellm.ai/
    transport: anthropic_messages
    key_env: HERMES_LITELLM_API_KEY
    session_affinity_header: x-litellm-session-id

delegation:
  roles:
    explorer:
      provider: litellm-anthropic
      model: MiniMax-M3.1-Flash
      max_concurrent_children: 4
    implementer:
      provider: litellm
      model: implementation-pool
    reviewer:
      provider: litellm-anthropic
      model: MiniMax-M3.1-Flash
    oracle:
      provider: litellm
      model: glm-5.3-flash
  max_iterations: 250

mcp_servers:
  paseo:
    url: "http://paseo.ai:6767/mcp/agents"
    headers:
      Host: "paseo.${MAIN_DOMAIN}"
      Authorization: "Bearer $${PASEO_PASSWORD}"
