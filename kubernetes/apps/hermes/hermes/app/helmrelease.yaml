---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 15m
  dependsOn: []
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 10000
        runAsGroup: 10000
        runAsNonRoot: true
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -euo pipefail
                cp /tmp/config.yaml /opt/data/config.yaml
                cp /tmp/honcho.json /opt/data/honcho.json
                chown 10000:10000 /opt/data/config.yaml /opt/data/honcho.json
                MEMINI_PLUGIN_DIR=/opt/data/plugins/memini
                if [ -e "$MEMINI_PLUGIN_DIR" ]; then
                  mkdir -p /opt/data/.disabled-plugins
                  DISABLED_PLUGIN_DIR=/opt/data/.disabled-plugins/memini
                  if [ -e "$DISABLED_PLUGIN_DIR" ]; then
                    DISABLED_PLUGIN_DIR="/opt/data/.disabled-plugins/memini-$(date +%s)"
                  fi
                  mv "$MEMINI_PLUGIN_DIR" "$DISABLED_PLUGIN_DIR"
                fi
        containers:
          app:
            image: &image
              repository: nousresearch/hermes-agent
              tag: v2026.8.3@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e
            args: ["gateway", "run", "--no-supervise", "--force"]
            env:
              HONCHO_BASE_URL: http://honcho.ai.svc.cluster.local
              HERMES_LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-hermes
                    key: api-key
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: &tz ${TZ}
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 2Gi
            ports:
              - containerPort: &port 8642
                name: http
                protocol: TCP
          dashboard:
            image: *image
            env:
              TZ: *tz
              GATEWAY_HEALTH_URL: http://localhost:8642
            args:
              - dashboard
              - --host
              - "::"
              - --insecure
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 1Gi
            ports:
              - containerPort: &dashboardPort 9119
                name: http
                protocol: TCP
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.131.0@sha256:3623e6362abdec6258472882b06fdeec9d6ce2ad3fda316b3c5d7ed092b89add
            env:
              TZ: *tz
            args:
              - "--auth"
              - "none"
              - "--user-data-dir"
              - "/home/node/.vscode"
              - "--extensions-dir"
              - "/home/node/.vscode"
              - "--port"
              - "12321"
              - "/opt/data"
            ports:
              - containerPort: &codeserverPort 12321
                name: codeserver
                protocol: TCP
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 1Gi
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port
          codeserver:
            port: *codeserverPort
      dashboard:
        ports:
          http:
            port: 80
            targetPort: *dashboardPort

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${MAIN_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: dashboard
                port: http

      codeserver:
        hostnames: ["{{ .Release.Name }}-code.${MAIN_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: codeserver

    persistence:
      data:
        existingClaim: *app
        globalMounts:
          - path: /opt/data

      config:
        type: configMap
        name: "hermes-config"
        defaultMode: 0755
        globalMounts:
          - path: /tmp/config.yaml
            subPath: config.yaml
          - path: /tmp/honcho.json
            subPath: honcho.json

      # gallery:
      #   type: nfs
      #   server: voyager.internal
      #   path: /mnt/daena/comfyui/output
      #   globalMounts:
      #     - path: /mnt/gallery
