---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app opencloud
  namespace: &namespace opencloud
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/oidc
    - ../../../../components/kopiur
    - ../../../../components/gatus/external
    - ../../../../components/secret
  dependsOn:
    - name: kopiur
      namespace: kopiur-system
  interval: 1h
  path: ./kubernetes/apps/opencloud/opencloud/app
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      DOMAIN: "${MAIN_DOMAIN}"
      SUBDOMAIN: cloud

      OIDC_PUBLIC_CLIENT: "true"
      OIDC_DISPLAY_NAME: "OpenCloud"
      OIDC_CALLBACK: /oidc-callback.html
      OIDC_EXTRA_CALLBACKS: >-
        ["https://cloud.${MAIN_DOMAIN}/oidc-silent-redirect.html",
         "oc://android.opencloud.eu",
         "oc://ios.opencloud.eu"]
      OIDC_LOCALHOST: "true"
      OIDC_SHORT_USERNAME: "true"
      OIDC_SCOPES: '["openid", "profile", "email", "groups", "offline_access"]'
      OIDC_CLAIM_MAPS: |
        {
          "roles": {
            "joinType": "array",
            "valuesByGroup": {
              "users@idm.${MAIN_DOMAIN}": ["user"],
              "admins@idm.${MAIN_DOMAIN}": ["admin"]
            }
          }
        }
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
