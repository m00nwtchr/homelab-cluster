---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive-operator
  namespace: &namespace toolhive
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: toolhive-operator-crds
  components: []
  interval: 1h
  path: ./kubernetes/apps/toolhive/toolhive/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-operator-crds
  namespace: &namespace toolhive
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: &app toolhive-operator
  components: []
  interval: 1h
  path: ./kubernetes/apps/toolhive/toolhive/crds
  prune: false
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: toolhive-config
  namespace: &namespace toolhive
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: &app toolhive
  dependsOn:
    - name: toolhive-operator
  components:
    - ../../../../components/secret
    - ../../../../components/oidc
  interval: 1h
  path: ./kubernetes/apps/toolhive/toolhive/config
  postBuild:
    substitute:
      APP: *app
      NAMESPACE: *namespace
      DOMAIN: "${MAIN_DOMAIN}"
      SUBDOMAIN: mcp
      OIDC_DISPLAY_NAME: "Toolhive MCP"
      OIDC_CALLBACK: /oauth/callback
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
