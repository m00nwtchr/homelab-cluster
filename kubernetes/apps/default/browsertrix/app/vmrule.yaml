---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/operator.victoriametrics.com/vmrule_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: browsertrix-alerts
  labels:
    alert-source: victorialogs
spec:
  groups:
    - name: browsertrix
      type: vlogs
      interval: 1m
      rules:
        - alert: BrowsertrixRateLimited
      expr: |
        _time:5m
        kubernetes.pod_namespace:="default"
        kubernetes.container_name:="app"
        context:="pageStatus"
        message:="Page possibly rate limited, retrying"
        | stats count() as hits
        | filter hits:>3
