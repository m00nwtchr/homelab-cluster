---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: browsertrix
spec:
  interval: 1h

  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system

  # disableWaitForJobs set by Kustomize component

  values:
    controllers:
      profile:
        type: deployment
        forceRename: browsertrix-profile
        replicas: 1
        strategy: Recreate

        containers:
          app:
            image:
              repository: docker.io/webrecorder/browsertrix-crawler
              tag: 1.15.3@sha256:f4f9cc3c4dd169203fe9577bb10148a7bb709e71e73bf5388465e452c70a3d6f

            ports:
              - name: profile-ui
                containerPort: 9223
                protocol: TCP
              - name: novnc
                containerPort: 6080
                protocol: TCP

            command:
              - /bin/sh
              - -ec

            args:
              - |
                PROFILE=/crawls/profiles/profile.tar.gz
                NEW_PROFILE=/crawls/profiles/profile-new.tar.gz

                mkdir -p /crawls/profiles
                rm -f "$NEW_PROFILE"

                if [ -s "$PROFILE" ]; then
                  echo "Refreshing existing browser profile..."

                  /docker-entrypoint.sh create-login-profile \
                    --url https://forum.theonyxpath.com/ \
                    --profile "$PROFILE" \
                    --filename "$NEW_PROFILE"
                else
                  echo "Creating new browser profile..."

                  /docker-entrypoint.sh create-login-profile \
                    --url https://forum.theonyxpath.com/ \
                    --filename "$NEW_PROFILE"
                fi

                test -s "$NEW_PROFILE"

                mv -f "$NEW_PROFILE" "$PROFILE"
                echo "Browser profile saved."

                exec sleep infinity

      browsertrix:
        type: job
        forceRename: browsertrix

        job:
          backoffLimit: 4
          parallelism: 1
          completions: 1

        pod:
          restartPolicy: Never
          terminationGracePeriodSeconds: 900

        containers:
          app:
            image:
              repository: docker.io/webrecorder/browsertrix-crawler
              tag: 1.15.3@sha256:f4f9cc3c4dd169203fe9577bb10148a7bb709e71e73bf5388465e452c70a3d6f

            command:
              - /bin/sh
              - -ec

            args:
              - |
                PROFILE=/crawls/profiles/profile.tar.gz
                COLLECTION=onyx-forums-full
                COLLECTION_DIR="/crawls/collections/$COLLECTION"
                STATE_DIR="$COLLECTION_DIR/crawls"

                while [ ! -s "$PROFILE" ]; do
                  echo "Waiting for browser profile..."
                  sleep 10
                done

                echo "Browser profile ready."

                set -- \
                  --url https://forum.theonyxpath.com/ \
                  --scopeType host \
                  --exclude '^https?://forum\.theonyxpath\.com/(register|login|logout|lostpw|search|contact-us)([/?#]|$)' \
                  --profile "$PROFILE" \
                  --collection "$COLLECTION" \
                  --workers 2 \
                  --generateWACZ \
                  --text to-pages \
                  --saveState always \
                  --saveStateInterval 900 \
                  --saveStateHistory 10 \
                  --logExcludeContext links

                STATE=""
                if [ -d "$STATE_DIR" ]; then
                  STATE="$(find "$STATE_DIR" -maxdepth 1 -type f -name '*.yaml' |
                    sort | tail -n 1)"
                fi

                if [ -n "$STATE" ]; then
                  if [ -d "$COLLECTION_DIR/logs" ] &&
                     grep -Rqs '"message":"Page Finished"' "$COLLECTION_DIR/logs"; then

                    echo "Resuming crawl from: $STATE"
                    set -- "$@" --config "$STATE"

                  else
                    echo "Previous crawl recorded no successful pages."
                    echo "Preserving failed collection and starting fresh."

                    BACKUP="${COLLECTION_DIR}.failed-$(date -u +%Y%m%dT%H%M%SZ)"
                    mv "$COLLECTION_DIR" "$BACKUP"
                  fi
                else
                  echo "No checkpoint found. Starting fresh."
                fi

                echo "Starting Browsertrix..."
                exec /docker-entrypoint.sh crawl "$@"

    service:
      profile:
        controller: profile
        forceRename: browsertrix-profile
        ports:
          ui:
            port: 9223
            protocol: TCP
          novnc:
            port: 6080
            protocol: TCP

    persistence:
      crawls:
        type: persistentVolumeClaim
        forceRename: browsertrix-crawls
        storageClass: zfs-vault
        accessMode: ReadWriteOnce
        size: 1Ti
        retain: true
        annotations:
          helm.sh/resource-policy: keep
        globalMounts:
          - path: /crawls

      tmp:
        type: emptyDir
        sizeLimit: 8Gi
        globalMounts:
          - path: /tmp

      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
