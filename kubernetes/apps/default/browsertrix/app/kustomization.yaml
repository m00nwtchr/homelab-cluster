---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: browsertrix
    patch: |-
      - op: add
        path: /spec/install/disableWaitForJobs
        value: true
      - op: add
        path: /spec/upgrade/disableWaitForJobs
        value: true
