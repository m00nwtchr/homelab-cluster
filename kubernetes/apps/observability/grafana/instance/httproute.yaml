---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-public
spec:
  parentRefs:
    - name: external
      namespace: network
  hostnames:
    - grafana.${MAIN_DOMAIN}
  rules:
    - matches:
        # Public dashboard pages
        - path:
            type: PathPrefix
            value: /public-dashboards

        # Public dashboard data/query API
        - path:
            type: PathPrefix
            value: /api/public/dashboards

        # Grafana frontend bootstrap data
        - path:
            type: PathPrefix
            value: /bootdata

        # Static assets, including plugins
        - path:
            type: PathPrefix
            value: /public

      backendRefs:
        - name: grafana-service
          port: 3000
