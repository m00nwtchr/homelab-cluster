---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/operator.victoriametrics.com/vmalert_v1beta1.json
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlert
metadata:
  name: vlogs
spec:
  datasource:
    url: http://vlsingle-vl.observability.svc.cluster.local:9428

  notifiers:
    - url: http://vmalertmanager-vmks-0.vmalertmanager-vmks.observability.svc.cluster.local.:9093

  remoteRead:
    url: http://vmsingle-vmks.observability.svc.cluster.local.:8428

  remoteWrite:
    url: http://vmsingle-vmks.observability.svc.cluster.local.:8428/api/v1/write

  extraArgs:
    enableTCP6: "true"
    remoteWrite.disablePathAppend: "true"
    rule.evalDelay: "5s"

  configReloaderExtraArgs:
    enableTCP6: "true"

  evaluationInterval: 1m

  ruleSelector:
    matchLabels:
      alert-source: victorialogs
