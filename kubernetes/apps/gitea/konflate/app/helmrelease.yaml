---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: konflate
spec:
  interval: 15m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.6.1
  url: oci://ghcr.io/home-operations/charts/konflate
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/home-operations/konflate.*$"
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app konflate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  values:
    config:
      repo: forgejo://git.${SECRET_DOMAIN}/m00n/homelab-cluster
      statusChecks: true
      prComments: true
      verifyImages: true
      publicUrl: https://${APP}.${MAIN_DOMAIN}
      mcp: true
    secret:
      existingSecret: *app
    httpRoute:
      enabled: true
      hostnames:
        - ${APP}.${MAIN_DOMAIN}
      parentRefs:
        - name: internal
          namespace: network
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: 2000m
        memory: 2Gi
