---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app phanpy
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m
  values:
    controllers:
      *app :
        containers:
          main:
            image:
              repository: ghcr.io/jjgadgets/phanpy
              tag: 2026.06.23.05dcc55@sha256:178a857ba5f3d12664e5bee15a617958b8799d81dbda36662276362268c5e42f
            env:
              PHANPY_WEBSITE: "{{ .Release.Name }}.${MAIN_DOMAIN}"
              PHANPY_DEFAULT_INSTANCE: "${MAIN_DOMAIN}"
            resources:
              requests:
                cpu: 10m
              # limits:
              #   memory: 512Mi
    service:
      main:
        controller: phanpy
        ports:
          http:
            port: 80
            targetPort: 8080
    route:
      app:
        parentRefs:
          - name: external
            namespace: network
          - name: internal
            namespace: network
        hostnames:
          - "{{ .Release.Name }}.${MAIN_DOMAIN}"
