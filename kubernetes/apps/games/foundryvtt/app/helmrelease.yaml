---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app foundryvtt
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: "OnRootMismatch"

    controllers:
      *app :
        pod:
          hostname: "{{ .Release.Name }}"

        containers:
          app:
            image:
              repository: docker.io/felddy/foundryvtt
              tag: 14.370.0@sha256:24af7e8a402291d3b54443dc7266f6a8fe4a792553171c1a076e1290abda9b53
            env:
              CONTAINER_CACHE: /data/container_cache
              CONTAINER_VERBOSE: "true"
              CONTAINER_PATCHES: "/config/patches"
              FOUNDRY_COMPRESS_WEBSOCKET: "true"
              # FOUNDRY_CSS_THEME: scifi
              FOUNDRY_HOSTNAME: "{{ .Release.Name }}.${MAIN_DOMAIN}"
              FOUNDRY_IP_DISCOVERY: "false"
              FOUNDRY_LOCAL_HOSTNAME: "{{ .Release.Name }}.${MAIN_DOMAIN}"
              FOUNDRY_MINIFY_STATIC_FILES: "true"
              FOUNDRY_PROXY_PORT: "443"
              FOUNDRY_PROXY_SSL: "true"
              FOUNDRY_TELEMETRY: "false"
              FOUNDRY_UPNP: "false"
              FOUNDRY_AWS_CONFIG: "/config/s3.json"
              TZ: "${TZ}"
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: &port 30000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 4Gi

    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${MAIN_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
          - name: internal
            namespace: network

    externalSecrets:
      s3:
        suffix: s3
        secretStoreRef:
          kind: ClusterSecretStore
          name: infisical
        target:
          template:
            data:
              s3.json: |
                {
                  "region": "{{ .S3_REGION }}",
                  "endpoint": "{{ .S3_ENDPOINT }}",
                  "credentials": {
                    "accessKeyId": "{{ .S3_KEY_ID }}",
                    "secretAccessKey": "{{ .S3_KEY }}"
                  }
                }
        dataFrom:
          - find:
              path: /foundryvtt

    persistence:
      data:
        existingClaim: *app

      patches:
        type: configMap
        name: foundry-patches
        globalMounts:
          - path: /config/patches

      s3:
        type: secret
        name: "{{ .Release.Name }}-s3"
        globalMounts:
          - path: /config/s3.json
            subPath: s3.json

      npm-cache:
        type: emptyDir
        globalMounts:
          - path: /home/node/.npm
