---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app foundryvtt
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        fsGroup: 65532
        fsGroupChangePolicy: "OnRootMismatch"

    controllers:
      *app :
        pod:
          hostname: "{{ .Release.Name }}"

        containers:
          app:
            image:
              repository: docker.io/felddy/foundryvtt
              tag: 14.369.1@sha256:2ddf90080c605ebafaaabc4fbfb6bea3cc84d20ad181ce39420e4f86e664a484
            env:
              CONTAINER_CACHE: /data/container_cache
              CONTAINER_VERBOSE: "true"
              FOUNDRY_COMPRESS_WEBSOCKET: "true"
              # FOUNDRY_CSS_THEME: scifi
              FOUNDRY_HOSTNAME: "{{ .Release.Name }}.${MAIN_DOMAIN}"
              FOUNDRY_IP_DISCOVERY: "false"
              FOUNDRY_LOCAL_HOSTNAME: "{{ .Release.Name }}.${MAIN_DOMAIN}"
              FOUNDRY_MINIFY_STATIC_FILES: "true"
              FOUNDRY_PROXY_PORT: "443"
              FOUNDRY_PROXY_SSL: "true"
              FOUNDRY_TELEMETRY: "false"
              FOUNDRY_UPNP: "false"
              TZ: "${TZ}"
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/status
                    port: &port 30000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 4Gi

    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${MAIN_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
          - name: internal
            namespace: network

    persistence:
      data:
        existingClaim: *app

      npm-cache:
        type: emptyDir
        globalMounts:
          - path: /home/node/.npm
