---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app palworld
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 15m
  values:
    controllers:
      *app :
        type: statefulset

        pod:
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }

        containers:
          app:
            image:
              repository: ghcr.io/pocketpairjp/palserver
              tag: v1.0.1.100619@sha256:0d293cafd503a91a6d11d71f7bf770ee0c3c5ecf37db988349b2c1758f4e9358
            command:
              - /bin/bash
              - /scripts/patch-palworld-settings.sh
            args:
              - -port=8211
              - -useperfthreads
              - -NoAsyncLoadingThread
              - -UseMultithreadForDS
            ports:
              - containerPort: &port 8211
                name: palworld
                protocol: UDP
            securityContext:
              readOnlyRootFilesystem: false
              capabilities: { drop: [ALL] }
            # resources:
            # requests:
            #   cpu: 500m
            #   memory: 1Gi
            # limits:
            #   memory: 1Gi

    service:
      app:
        ipFamilies: [IPv4]
        ports:
          palworld:
            port: *port
            protocol: UDP

    route:
      app:
        kind: UDPRoute
        parentRefs:
          - kind: ListenerSet
            name: palworld
            namespace: games
            sectionName: palworld
        rules:
          - backendRefs:
              - identifier: app

    persistence:
      config:
        type: configMap
        name: palworld-config
        globalMounts:
          - path: /scripts/patch-palworld-settings.sh
            subPath: patch-palworld-settings.sh

      data:
        existingClaim: *app
        globalMounts:
          - path: /pal/Package/Pal/Saved
