---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: palworld
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.1.0
  url: oci://ghcr.io/m00nwtchr/charts/palworld
  # verify:
  #   matchOIDCIdentity:
  #     - issuer: ^https://token.actions.githubusercontent.com$
  #       subject: ^https://github.com/m00nwtchr/agones-palworld.*$
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app palworld
  namespace: &namespace games
spec:
  chartRef:
    kind: OCIRepository
    name: *app
  interval: 15m
  values:
    palworld:
      image:
        repository: ghcr.io/pocketpairjp/palserver
        tag: v1.0.3.101283@sha256:ffb778dd63a04cf0d901b95e934e547e1fee67234e33102d5b5bf7da36e2b264
        pullPolicy: IfNotPresent
      env:
        PALWORLD_SERVER_NAME: "m00n's Palworld Server"
        PALWORLD_ALLOW_GLOBAL_PALBOX_IMPORT: "True"
        PALWORLD_BASE_CAMP_WORKER_MAX_NUM: "30"
      envFrom:
        - secretRef:
            name: *app

    pvc:
      existingClaim: *app

    service:
      type: LoadBalancer
      # clusterIP: None
