---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: OCIRepository
metadata:
  name: agones-palworld
  namespace: flux-system
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  provider: generic
  ref:
    tag: 0.1.0
  url: oci://ghcr.io/m00nwtchr/charts/palworld
  # Trust the chart provenance: the CI workflow in m00nwtchr/agones-palworld
  # uses softprops/action-gh-release@v2 with GH Actions OIDC tokens.
  verify:
    matchOIDCIdentity:
      - issuer: ^https://token.actions.githubusercontent.com$
        subject: ^https://github.com/m00nwtchr/agones-palworld.*$
