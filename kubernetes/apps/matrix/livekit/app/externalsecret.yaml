---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &app livekit-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: "livekit-config"
    template:
      engineVersion: v2
      templateFrom:
        - configMap:
            name: "livekit-configmap"
            items:
              - key: config.yaml
  dataFrom:
    - find:
        path: /stunner
---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: livekit
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    template:
      engineVersion: v2
      data:
        LIVEKIT_KEY: livekit-jwt
        LIVEKIT_SECRET: "{{ .password }}"
        LIVEKIT_KEYS: |
          livekit-jwt: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw
