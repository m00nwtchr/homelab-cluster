---
# yaml-language-server: $schema=https://k8s-schemas.m00nlit.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: livekit
spec:
  refreshPolicy: OnChange

  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical

  target:
    name: livekit
    template:
      engineVersion: v2

      data:
        LIVEKIT_KEY: "{{ .user }}"
        LIVEKIT_SECRET: "{{ .password }}"
        LIVEKIT_KEYS: |
          {{ .user }}: {{ .password | toJson }}

      templateFrom:
        - configMap:
            name: livekit-configmap
            items:
              - key: config.yaml

  dataFrom:
    - find:
        path: /stunner

    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: pw

    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: user
