---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app livekit
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: livekit/livekit-server
              tag: v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
            env:
              LIVEKIT_CONFIG:
                valueFrom:
                  secretKeyRef:
                    name: livekit
                    key: config.yaml
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 18m
                memory: 154Mi
              limits:
                memory: 154Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

      jwt:
        labels:
          m00nlit.dev/no-dragonfly-stunnel: "true"

        containers:
          app:
            image:
              repository: ghcr.io/element-hq/lk-jwt-service
              tag: 0.9.0@sha256:d210fd778ba38b7e42e6fc64e8a24a7d66ccc3b938fb20d73bd713224af2dfea
            env:
              LIVEKIT_URL: wss://livekit.${MAIN_DOMAIN}
              LIVEKIT_FULL_ACCESS_HOMESERVERS: "${MAIN_DOMAIN}"
            envFrom:
              - secretRef:
                  name: *app
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /healthz
                port: 8080
                spec:
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  failureThreshold: 3
                  timeoutSeconds: 5
              readiness:
                enabled: true
                type: HTTP
                path: /healthz
                port: 8080
                spec:
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  failureThreshold: 3
                  timeoutSeconds: 3
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 100Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }

    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        forceRename: *app
        controller: *app
        ipFamilies: [IPv4]
        ports:
          http:
            port: 80
            targetPort: 7880
          rtc-tcp:
            port: 7881
          metrics:
            port: 6789

      jwt:
        controller: jwt
        ports:
          http:
            port: 80
            targetPort: 8080

    serviceMonitor:
      app:
        serviceName: app
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${MAIN_DOMAIN}"]
        parentRefs:
          - name: external
            namespace: network
          - name: internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: *app
                port: 80
          - matches:
              - path:
                  type: PathPrefix
                  value: /sfu/get
              - path:
                  type: PathPrefix
                  value: /healthz
              - path:
                  type: PathPrefix
                  value: /get_token
              - path:
                  type: PathPrefix
                  value: /sfu_webhook
            backendRefs:
              - name: livekit-jwt
                port: 80
