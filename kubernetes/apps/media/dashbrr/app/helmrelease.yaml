---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dashbrr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: openebs
      namespace: openebs-system
  values:
    controllers:
      *app :
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          automountServiceAccountToken: true
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/autobrr/dashbrr
              tag: v0.5.1@sha256:7d138a4977c29b0b28692a4826a5ce3b41fb0b4c17454d146a900f8b05d48522
            workingDir: /config
            env:
              TZ: ${TZ}
              DASHBRR__LISTEN_ADDR: "[::]:8080"
              DASHBRR__LOG_LEVEL: DEBUG

              DASHBRR__CONFIG_PATH: /config/config.toml

              DASHBRR__DB_TYPE: "sqlite"
              DASHBRR__DB_PATH: "/config/dashbrr.db"

              # DASHBRR__DB_TYPE: "postgres"
              DASHBRR__DB_HOST: "pooler-rw-se.postgres.svc"
              PGSSLROOTCERT: /var/run/secrets/root-ca/ca.crt
              PGSSLCERT: /var/run/secrets/postgresql/tls.crt
              PGSSLKEY: /var/run/secrets/postgresql/tls.key
              PGSSLMODE: verify-full

              DASHBRR__OIDC_ISSUER: https://idm.${MAIN_DOMAIN}/oauth2/openid/${APP}/
              DASHBRR__OIDC_CLIENT_ID: *app
              DASHBRR__OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: kanidm-${APP}-oidc
                    key: client-secret
              DASHBRR__OIDC_REDIRECT_URL: https://${APP}.${MAIN_DOMAIN}/api/auth/oidc/callback
            # envFrom:
            #   - secretRef:
            #       name: autobrr-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        ports:
          http:
            port: 80
            targetPort: 8080

    rbac:
      roles:
        dashbrr-discovery:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: ["services"]
              verbs: ["get", "list", "watch"]
      bindings:
        dashbrr-discovery:
          type: ClusterRoleBinding
          roleRef:
            identifier: dashbrr-discovery
          subjects:
            - identifier: *app

    persistence:
      config:
        type: emptyDir

    route:
      app:
        hostnames: ["{{ .Release.Name }}.${MAIN_DOMAIN}"]
        parentRefs:
          - name: internal
            namespace: network
